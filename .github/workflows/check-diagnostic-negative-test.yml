name: Check the proposed SWA001 diagnostic (true positive)

on:
  workflow_dispatch:
  push:
    branches: [proposed-diagnostic-fix-negative-test]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (no cache) — expect exactly one SWA001 warning
        run: |
          docker build --no-cache -t app -f Essessay/Dockerfile . 2>&1 | tee /tmp/build.log
          count=$(grep -c "SWA001" /tmp/build.log || true)
          echo "SWA001 occurrences: $count"
          if [ "$count" = "1" ] && grep "SWA001" /tmp/build.log | grep -q "wwwroot/css/site.css"; then
            echo "PASS: fired exactly once, on exactly the broken file"
          else
            echo "FAIL: expected exactly one SWA001 warning naming wwwroot/css/site.css"
            exit 1
          fi
      - name: Confirm the underlying manifest bug is actually present too
        run: |
          docker run --rm --entrypoint sh app -c "
            grep -o '\"Route\":\"[^\"]*site.css[^\"]*\"' /app/Essessay.staticwebassets.endpoints.json
          " | tee /tmp/result.txt
          if grep -q '"Route":"css/site.css"' /tmp/result.txt; then
            echo "FAIL: manifest route present — diagnostic fired without the underlying bug, that's a false positive"
            exit 1
          else
            echo "PASS: manifest route missing too, correlating with the SWA001 warning"
          fi
